[package]
name = "pyreqwest"
version = "0.15.2"
edition = "2024"

[lib]
name = "pyreqwest"
crate-type = ["cdylib"]

[dependencies.reqwest]
version = "=0.13.5"
default-features = false
features = [
    "rustls",
    "http2",
    "query",
    "multipart",
    "form",
    "cookies",
    "stream",
    "socks",
    "gzip",
    "zstd",
    "brotli",
    "deflate",
]

[dependencies]
pyo3 = { version = "=0.29.3", features = ["extension-module", "experimental-async", "time", "generate-import-lib"] }
pyo3-bytes = "=0.7.1"
pythonize = "=0.29.0"
hyper = { version = "=1.12.0", features = ["client", "http1", "http2"] }
rustls = "=0.23.45"
http = "=1.5.0"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-util = "=0.7.20"
futures-util = "=0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
serde_urlencoded = "=0.7.1"
bytes = "=1.12.1"
url = { version = "=2.5.8", features = ["serde"] }
mime = "=0.3.17"
cookie = "=0.18.2"
cookie_store = { version = "=0.22.1", features = ["preserve_order"] }
encoding_rs = "=0.8.42"
http-body-util = "=0.1.5"
pin-project = "=1.1.13"
time = "=0.3.55"
regex = "=1.13.1"
log = "=0.4.34"
base64 = "=0.23.1"

# Official Rust crate from upstream mimalloc (microsoft/mimalloc, contrib/rust), used as a git dependency
# as it is not published to crates.io. The crates.io `mimalloc` crate (purpleprotocol/mimalloc_rust) is
# unmaintained and stuck on an old mimalloc release (v3.3.2) that misses many upstream fixes, e.g.:
# - segfault on thread heap init (microsoft/mimalloc#1287), crashing when a thread that first loaded
#   this module exits (#59)
# - fixed pthread TSD slots on macOS that collide with other static mimalloc copies in the process,
#   corrupting their memory (e.g. pyarrow). Newer versions use per-instance pthread keys instead.
# Switch back to crates.io if the official crate gets published there.
mimalloc = { git = "https://github.com/microsoft/mimalloc", tag = "v3.7.0", default-features = false, features = ["local_dynamic_tls"], optional = true }

[build-dependencies]
pyo3-build-config = "=0.29.3"

[features]
mimalloc = ["dep:mimalloc"]

[profile.release]
codegen-units = 1
lto = "fat"
strip = true

[profile.profiling]
inherits = "release"
lto = "thin"
strip = false
debug = true

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
